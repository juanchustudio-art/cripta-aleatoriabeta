name: Compilar APK y EXE
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run apk:init
      - run: npm run apk:sync
      - name: Dejar el juego en horizontal
        run: sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Cripta-Aleatoria-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run exe
      - uses: actions/upload-artifact@v4
        with:
          name: Cripta-Aleatoria-EXE
          path: dist/Cripta-Aleatoria.exe
